name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check dynamo tests benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Proto bindings are up to date
        run: |
          pip install grpcio-tools==1.85.1   # the version the committed bindings were generated with
          python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. dynamo/proto/dynamo.proto
          git diff --exit-code dynamo/proto
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests
        run: pytest tests/integration
      - name: End-to-end tests
        run: pytest tests/e2e
