[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-kv"
version = "1.0.0"
description = "A Dynamo-style distributed key-value store: consistent hashing, quorum replication, vector clocks, hinted handoff, read repair and gossip."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.85.1",
    "protobuf>=7.35.1,<8",
]

[project.urls]
Repository = "https://github.com/Manas-Inamdar/dynamo_db"
Documentation = "https://github.com/Manas-Inamdar/dynamo_db/blob/main/docs/DESIGN.md"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]
bench = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
dynamo-server = "dynamo.server:main"
dynamo-cli = "dynamo.client:main"

[tool.setuptools.packages.find]
include = ["dynamo*"]

[tool.setuptools.package-data]
"dynamo.proto" = ["*.proto", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: starts in-process gRPC clusters (seconds per test)",
    "e2e: launches real server processes via the CLI (slowest)",
]
addopts = "-ra --strict-markers"
log_level = "INFO"
log_format = "%(asctime)s.%(msecs)03d %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["dynamo/proto/*_pb2*.py", "dynamo/proto/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
